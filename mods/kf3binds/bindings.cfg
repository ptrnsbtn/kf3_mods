// kf3binds — keyboard and mouse bindings for the game's pad buttons.
//
// One binding per line:   <Button> = <Input>
// Lines starting with // or # are comments. The file is re-read about once a
// second when it changes — save it and the new bindings apply, no restart.
//
// ---------------------------------------------------------------------------
// <Button> — the game's pad button (the names KF3_AUTOPAD and the shell use):
//
//   Select  Start   Cross   Circle   Square   Triangle
//   L1  R1  L2  R2  L3  R3
//   Up  Down  Left  Right
//
// On this game Cross is the action button (confirm, pick up, open).
//
// ---------------------------------------------------------------------------
// <Input> — one of:
//
//   Keyboard keys: any Silk.NET key name, case-insensitive.
//     Letters:   A B C ... Z
//     Digits:    D1 D2 D3 D4 D5 D6 D7 D8 D9 D0   (the number row; D1 is "1")
//     Modifiers: ControlLeft ControlRight ShiftLeft ShiftRight AltLeft AltRight
//     Others:    Space Enter Tab Escape Backspace Delete Insert Home End
//                PageUp PageDown Up Down Left Right F1 .. F12
//     (Anything Enum.Parse accepts; a name that is not a key is ignored with
//      a warning in the log.)
//
//   Mouse buttons — the usual names, where the numbering is the driver's
//   "extra buttons" count after the three main ones:
//
//     Mouse1   left button
//     Mouse2   right button
//     Mouse3   middle button (wheel click)
//     Mouse4   FIRST thumb button  — usually the "back" thumb button
//     Mouse5   SECOND thumb button — usually the "forward" thumb button
//     Mouse6..Mouse12  any further side buttons, in driver order
//
//     If your thumb buttons fire the wrong way round (a common driver
//     quirk), just swap Mouse4 and Mouse5 in the binding — the names are
//     positions in the driver's list, not a hardware constant. On Linux
//     under Wayland/SDL these are SDL buttons 4 and 5, which is where the
//     "Mouse4/Mouse5" nickname comes from.
//
//   Mouse wheel — one press per notch, held for HoldMs (below) so the game's
//   frame poll cannot miss it:
//
//     WheelDown   scrolled away from you (notch down)
//     WheelUp     scrolled toward you (notch up)
//
//     The wheel is a shared drain: this mod and kf3csmove's wheel-jump read
//     the same notches, so with both on, whichever polls first gets them.
//     If you bind WheelDown here, rebind jump off the wheel in kf3csmove.
//
// ---------------------------------------------------------------------------
// Settings (not bindings):
//
//   HoldMs = 120          how long a wheel press is held (milliseconds)
//
// ---------------------------------------------------------------------------
// One button, several inputs: repeat the button's line -- e.g. Cross on the
// wheel down AND a thumb button, either one acting as Cross:
//
//  Cross = WheelDown
//  Cross = Mouse5
//
// ---------------------------------------------------------------------------
// Defaults shipped with the mod: the action button on the wheel down.

Cross = WheelDown

// Examples:
//  F = Square
//  G = Triangle
//  Mouse5 = Circle
//  R = Start
